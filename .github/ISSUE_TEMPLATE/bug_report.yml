name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please remove account names, emails and tokens from anything you paste.
  - type: input
    id: dsh
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.2-rc.5
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: CLI and version
      description: Output of `codex --version` or `claude --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
